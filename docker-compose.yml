services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  bot:
    build: ./bot
    container_name: bot
    restart: unless-stopped
    env_file:
      - path: .env            # НЕ в git; лежит на сервере в /opt/prive/.env
        required: false
    volumes:
      - bot_data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
  bot_data:

networks:
  web:
    name: web
